# Ngưỡng nồng độ cồn - TÌM TRONG NĐ 168 Điều 6, 7
alcohol_levels:
  - id: BAC_L1
    label: "Nồng độ cồn mức 1"
    blood_mg_100ml_min: 0.001
    blood_mg_100ml_max: 50
    breath_mg_l_min: 0.001
    breath_mg_l_max: 0.25
    description: "Chưa vượt quá 50 mg/100ml máu hoặc 0.25 mg/l khí thở"
    citation_id: "ND168-D6-K6-Pc"  # Điều 6 khoản 6 điểm c (xe ô tô)
    legal_text: "Điều khiển xe trên đường mà trong máu hoặc hơi thở có nồng độ cồn nhưng chưa vượt quá 50 miligam/100 mililít máu hoặc chưa vượt quá 0,25 miligam/1 lít khí thở"
    verified: true

  - id: BAC_L2
    label: "Nồng độ cồn mức 2"
    blood_mg_100ml_min: 50.001
    blood_mg_100ml_max: 80
    breath_mg_l_min: 0.25001
    breath_mg_l_max: 0.4
    description: "Vượt quá 50 đến 80 mg/100ml máu hoặc vượt quá 0.25 đến 0.4 mg/l khí thở"
    citation_id: "ND168-D6-K9-Pa"  # Điều 6 khoản 9 điểm a (xe ô tô)
    legal_text: "Điều khiển xe trên đường mà trong máu hoặc hơi thở có nồng độ cồn vượt quá 50 miligam đến 80 miligam/100 mililít máu hoặc vượt quá 0,25 miligam đến 0,4 miligam/1 lít khí thở"
    verified: true

  - id: BAC_L3
    label: "Nồng độ cồn mức 3"
    blood_mg_100ml_min: 80.001
    blood_mg_100ml_max: null
    breath_mg_l_min: 0.4001
    breath_mg_l_max: null
    description: "Vượt quá 80 mg/100ml máu hoặc vượt quá 0.4 mg/l khí thở"
    citation_id: "ND168-D6-K11-Pa"  # Điều 6 khoản 11 điểm a (xe ô tô)
    legal_text: "Điều khiển xe trên đường mà trong máu hoặc hơi thở có nồng độ cồn vượt quá 80 miligam/100 mililít máu hoặc vượt quá 0,4 miligam/1 lít khí thở"
    verified: true

# Ngưỡng tốc độ - TÌM TRONG NĐ 168 Điều 6 (ô tô) và Điều 7 (xe máy)
speed_bands:
  - id: SPEED_5_10
    label: "Vượt tốc độ 5-10 km/h"
    over_kmh_min: 5
    over_kmh_max: 9
    citation_car: "ND168-D6-K3-Pa"  # Điều 6 khoản 3 điểm a
    citation_motorbike: "ND168-D7-K2-Pb"  # Điều 7 khoản 2 điểm b
    legal_text: "Điều khiển xe chạy quá tốc độ quy định từ 05 km/h đến dưới 10 km/h"
    verified: true

  - id: SPEED_10_20
    label: "Vượt tốc độ 10-20 km/h"
    over_kmh_min: 10
    over_kmh_max: 20
    citation_car: "ND168-D6-K5-Pđ"  # Điều 6 khoản 5 điểm đ
    citation_motorbike: "ND168-D7-K4-Pa"  # Điều 7 khoản 4 điểm a
    legal_text: "Điều khiển xe chạy quá tốc độ quy định từ 10 km/h đến 20 km/h"
    verified: true

  - id: SPEED_20_35
    label: "Vượt tốc độ 20-35 km/h"
    over_kmh_min: 20.001
    over_kmh_max: 35
    citation_car: "ND168-D6-K6-Pa"  # Điều 6 khoản 6 điểm a
    citation_motorbike: "ND168-D7-K8-Pa"  # Điều 7 khoản 8 điểm a
    legal_text_car: "Điều khiển xe chạy quá tốc độ quy định trên 20 km/h đến 35 km/h"
    legal_text_motorbike: "Điều khiển xe chạy quá tốc độ quy định trên 20 km/h"
    verified: true

  - id: SPEED_OVER_35
    label: "Vượt tốc độ trên 35 km/h"
    over_kmh_min: 35.001
    over_kmh_max: null
    citation_car: "ND168-D6-K7-Pa"  # Điều 6 khoản 7 điểm a
    citation_motorbike: "ND168-D7-K8-Pa"  # Điều 7 khoản 8 (trên 20 km/h, không phân thêm mức 35)
    legal_text_car: "Điều khiển xe chạy quá tốc độ quy định trên 35 km/h"
    note: "Xe máy chỉ có mức trên 20 km/h, không phân biệt thêm 35 km/h"
    verified: true

