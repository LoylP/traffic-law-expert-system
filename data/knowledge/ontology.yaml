# Các quan hệ (edge types)
relationships:
  - type: BASED_ON
    description: "Violation → LegalUnit (vi phạm dựa trên điều luật)"
    source: Violation
    target: LegalUnit

  - type: INSTANCE_OF_ACT
    description: "Violation → Act (vi phạm là thể hiện của hành vi)"
    source: Violation
    target: Act

  - type: APPLIES_TO
    description: "Violation → VehicleClass (vi phạm áp dụng cho loại xe)"
    source: Violation
    target: VehicleClass

  - type: REQUIRES_CONTEXT
    description: "Violation → context node (yêu cầu ngữ cảnh: road/time/alcohol/speed)"
    source: Violation
    target: "[RoadType, TimeContext, AlcoholLevel, SpeedBand]"

  - type: HAS_SANCTION
    description: "Violation → AdditionalSanction"
    source: Violation
    target: AdditionalSanction

  - type: ESCALATES_TO
    description: "Violation → Violation (leo thang khi có hậu quả)"
    source: Violation
    target: Violation

  - type: EXCLUDES
    description: "Violation → Violation (loại trừ)"
    source: Violation
    target: Violation

  - type: SUBCLASS_OF
    description: "VehicleClass → VehicleClass, Circumstance → parent"
    source: "[VehicleClass, Circumstance]"
    target: "[VehicleClass, CircumstanceCategory]"

  - type: BELONGS_TO_DECREE
    description: "LegalUnit → Decree"
    source: LegalUnit
    target: Decree

  - type: IN_CHAPTER
    description: "LegalUnit → Chapter"
    source: LegalUnit
    target: Chapter

  - type: AMENDED_BY
    description: "LegalUnit → AmendmentEvent"
    source: LegalUnit
    target: AmendmentEvent
