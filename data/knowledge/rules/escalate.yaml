      consequence: [CONS_ACCIDENT]
      has_violation: ["ND168-D7-K9-Pa", "ND168-D7-K9-Pb", "ND168-D7-K9-Ph", "ND168-D7-K9-Pk"]
    then:
      escalate_to: "ND168-D7-K10-Pb"
    legal_excerpt: "Vi phạm quy định tại điểm a, điểm b, điểm h, điểm k khoản 9 Điều này mà gây tai nạn giao thông"
    source: "NĐ 168/2024, Điều 7 khoản 10 điểm b"
