  # NEW: VEH_MOTORBIKE + CONS_ACCIDENT + has_violation [ND168-D7-K3-Pd, ND168-D7-K7-Pa] → ND168-D7-K10-Pa
  - id: R-ESC-MOTO-WRONGLANE-WAY-ACCIDENT
    type: escalate
    priority: 35
    when:
      vehicle_class: VEH_MOTORBIKE
      consequence: [CONS_ACCIDENT]
      has_violation: ["ND168-D7-K3-Pd", "ND168-D7-K7-Pa"]
    then:
      escalate_to: "ND168-D7-K10-Pa"
    legal_excerpt: "Điều khiển xe không quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn theo quy định mà gây tai nạn giao thông; điều khiển xe chạy quá tốc độ quy định gây tai nạn giao thông; đi vào đường cao tốc, dừng xe, đỗ xe, quay đầu xe, lùi xe, vượt xe, chuyển hướng, chuyển làn đường không đúng quy định gây tai nạn giao thông; không đi đúng phần đường, làn đường, không giữ khoảng cách an toàn giữa hai xe theo quy định gây tai nạn giao thông hoặc đi vào đường có biển báo hiệu có nội dung cấm đi vào đối với loại phương tiện đang điều khiển, đi ngược chiều của đường một chiều, đi ngược chiều trên đường có biển 'Cấm đi ngược chiều' gây tai nạn giao thông"
    source: "NĐ 168/2024, Điều 7 khoản 10 điểm a"
    note: "Không đi đúng phần đường/làn đường (K3-Pd) hoặc đi ngược chiều (K7-Pa) gây tai nạn → khoản 10 điểm a"
    verified: true
