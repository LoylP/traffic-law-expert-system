  - id: R-ESC-MOTO-REDLIGHT-OFFICER
    type: escalate
    priority: 35
    when:
      vehicle_class: VEH_MOTORBIKE
      consequence: [CONS_ACCIDENT]
      has_violation: ["ND168-D7-K7-Pc", "ND168-D7-K7-Pd", "ND168-D7-K7-Pđ"]
    then:
      escalate_to: "ND168-D7-K10-Pb"
    legal_excerpt: "Vi phạm quy định tại điểm c, điểm d, điểm đ khoản 7 Điều này mà gây tai nạn giao thông"
