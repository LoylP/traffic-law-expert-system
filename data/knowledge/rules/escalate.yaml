    legal_excerpt: "Vi phạm quy định tại điểm đ khoản 4 Điều này mà gây tai nạn giao thông"
    source: "NĐ 168/2024, Điều 7 khoản 10 điểm b"
    verified: true

  - id: R-ESC-MOTO-YIELD
    type: escalate
    priority: 35
    when:
      vehicle_class: VEH_MOTORBIKE
      consequence: [CONS_ACCIDENT]
      has_violation: ["ND168-D7-K6-Pc", "ND168-D7-K6-Pd"]
    then:
