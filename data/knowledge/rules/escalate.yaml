    then:
      escalate_to: "ND168-D7-K10-Pb"
    legal_excerpt: "Vi phạm quy định tại điểm b, điểm e, điểm g, điểm h, điểm k khoản 3 Điều này mà gây tai nạn giao thông"
    source: "NĐ 168/2024, Điều 7 khoản 10 điểm b"
    verified: true

  - id: R-ESC-MOTO-PHONE
