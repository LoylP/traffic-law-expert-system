      has_violation: ["ND168-D7-K2-Pc", "ND168-D7-K2-Pđ", "ND168-D7-K2-Pg"]
    then:
      escalate_to: "ND168-D7-K10-Pb"
    legal_excerpt: "Vi phạm quy định tại điểm c, điểm đ, điểm g khoản 2 Điều này mà gây tai nạn giao thông"
    source: "NĐ 168/2024, Điều 7 khoản 10 điểm b"
    verified: true

  - id: R-ESC-MOTO-CARRY
    type: escalate
