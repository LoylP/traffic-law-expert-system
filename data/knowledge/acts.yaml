# Acts - Danh mục hành vi vi phạm (độc lập phương tiện)
# Tìm related_violations từ violations_168_clean.json dựa trên nội dung văn bản
# Mọi ID phải khớp với DESIGN; synonyms phải có ≥6 cách nói đời thường

acts:
