    label: "Không chấp hành hiệu lệnh của đèn tín hiệu giao thông"
    synonyms:
      - "vượt đèn đỏ"
      - "vượt đèn"
      - "chạy đèn đỏ"
      - "đi đèn đỏ"
      - "phóng qua đèn đỏ"
      - "không dừng đèn đỏ"
      - "cố tình vượt đèn"
      - "vi phạm đèn tín hiệu"
    related_violations:
      - "ND168-D6-K9-Pb"   # Xe ô tô - Điều 6 khoản 9 điểm b
      - "ND168-D7-K7-Pc"   # Xe máy - Điều 7 khoản 7 điểm c
      - "ND168-D9-K2-Pđ"   # Xe đạp, xe thô sơ - Điều 9 khoản 2 điểm đ
