      - "lái xe quá tốc độ"
      - "chạy nhanh vượt mức"
    related_violations:
      - "ND168-D6-K3-Pa"    # Xe ô tô 5-10 km/h
      - "ND168-D6-K5-Pđ"    # Xe ô tô 10-20 km/h
      - "ND168-D6-K6-Pa"    # Xe ô tô 20-35 km/h
      - "ND168-D6-K7-Pa"    # Xe ô tô trên 35 km/h
      - "ND168-D7-K2-Pb"    # Xe máy 5-10 km/h
      - "ND168-D7-K4-Pa"    # Xe máy 10-20 km/h
      - "ND168-D7-K8-Pa"    # Xe máy trên 20 km/h
