      - "uống bia lái xe"
      - "vi phạm cồn"
      - "kiểm tra nồng độ cồn vượt ngưỡng"
    related_violations:
      - "ND168-D6-K6-Pc"    # Xe ô tô - mức 1
      - "ND168-D6-K9-Pa"    # Xe ô tô - mức 2
      - "ND168-D6-K11-Pa"   # Xe ô tô - mức 3
      - "ND168-D7-K6-Pa"    # Xe máy - mức 1
