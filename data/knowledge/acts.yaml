    legal_ref: "NĐ 168/2024, Điều 6 khoản 6, 9, 11; Điều 7 khoản 6, 8, 9"
    verified: true

  # 3. Nhóm tốc độ
  - id: ACT_SPEEDING
    label: "Điều khiển xe chạy quá tốc độ quy định"
    synonyms:
