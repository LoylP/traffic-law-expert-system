# Circumstances - Danh mục tình tiết giảm nhẹ và tăng nặng
# Nguồn: Luật XLVPHC Điều 9, 10 từ file luat_xlvphc_dieu_9_10.txt
# KHÔNG viết từ trí nhớ, PARSE nguyên văn từ văn bản
# Ghi chú: Đối chiếu với văn bản hợp nhất Luật XLVPHC sau sửa đổi 2025 (Luật 88/2025/QH15)

mitigating_circumstances:
  - id: CIR_PREVENT_HARM
    kind: mitigating
    label: "Ngăn chặn, làm giảm bớt hậu quả hoặc tự nguyện khắc phục"
    legal_text: "Người vi phạm hành chính đã có hành vi ngăn chặn, làm giảm bớt hậu quả của vi phạm hoặc tự nguyện khắc phục hậu quả, bồi thường thiệt hại"
    synonyms:
      - "ngăn chặn hậu quả"
      - "giảm bớt thiệt hại"
      - "tự nguyện khắc phục"
      - "bồi thường thiệt hại"
      - "chủ động sửa chữa"
      - "giúp đỡ nạn nhân"
    legal_ref: "Luật XLVPHC Điều 9 khoản 1"
    verified: true

  - id: CIR_VOLUNTARY_CONFESS
    kind: mitigating
    label: "Tự nguyện khai báo, thành thật hối lỗi"
    legal_text: "Người vi phạm hành chính đã tự nguyện khai báo, thành thật hối lỗi; tích cực giúp đỡ cơ quan chức năng phát hiện vi phạm hành chính, xử lý vi phạm hành chính"
    synonyms:
      - "tự nguyện khai báo"
      - "thành thật hối lỗi"
      - "thừa nhận lỗi"
      - "hợp tác với cơ quan chức năng"
      - "giúp đỡ cơ quan điều tra"
      - "ăn năn hối cải"
    legal_ref: "Luật XLVPHC Điều 9 khoản 2"
    verified: true

  - id: CIR_PROVOKED
    kind: mitigating
    label: "Bị kích động tinh thần do hành vi trái pháp luật của người khác"
    legal_text: "Vi phạm hành chính trong tình trạng bị kích động về tinh thần do hành vi trái pháp luật của người khác gây ra; vượt quá giới hạn phòng vệ chính đáng; vượt quá yêu cầu của tình thế cấp thiết"
    synonyms:
      - "bị kích động"
      - "bị khiêu khích"
      - "phản ứng lại hành vi trái pháp luật"
      - "tình trạng căng thẳng tinh thần"
      - "bị gây sự trước"
      - "phòng vệ quá mức"
    legal_ref: "Luật XLVPHC Điều 9 khoản 3"
    verified: true

  - id: CIR_COERCED
    kind: mitigating
    label: "Bị ép buộc hoặc bị lệ thuộc về vật chất hoặc tinh thần"
    legal_text: "Vi phạm hành chính do bị ép buộc hoặc bị lệ thuộc về vật chất hoặc tinh thần"
    synonyms:
      - "bị ép buộc"
      - "bị lệ thuộc"
      - "bị cưỡng bức"
      - "không tự nguyện"
      - "bị chi phối"
    legal_ref: "Luật XLVPHC Điều 9 khoản 4"
    verified: true

  - id: CIR_PREGNANT_ELDERLY_DISABLED
    kind: mitigating
    label: "Phụ nữ mang thai, người già yếu, người khuyết tật"
    legal_text: "Người vi phạm hành chính là phụ nữ mang thai, người già yếu, người có bệnh hoặc khuyết tật làm hạn chế khả năng nhận thức hoặc khả năng điều khiển hành vi của mình"
    synonyms:
      - "phụ nữ mang thai"
      - "người già"
      - "người khuyết tật"
      - "người yếu"
      - "người ốm đau"
      - "hạn chế khả năng nhận thức"
    legal_ref: "Luật XLVPHC Điều 9 khoản 5"
    verified: true

  - id: CIR_HARDSHIP
    kind: mitigating
    label: "Hoàn cảnh đặc biệt khó khăn không do mình gây ra"
    legal_text: "Vi phạm hành chính vì hoàn cảnh đặc biệt khó khăn mà không do mình gây ra"
    synonyms:
      - "hoàn cảnh khó khăn"
      - "hoàn cảnh đặc biệt"
      - "hoàn cảnh éo le"
      - "bất đắc dĩ"
      - "tình thế khó khăn"
      - "hoàn cảnh bắt buộc"
    legal_ref: "Luật XLVPHC Điều 9 khoản 6"
    verified: true

  - id: CIR_BACKWARD
    kind: mitigating
    label: "Trình độ lạc hậu"
    legal_text: "Vi phạm hành chính do trình độ lạc hậu"
    synonyms:
      - "trình độ thấp"
      - "thiếu hiểu biết"
      - "chưa nhận thức đầy đủ"
      - "lạc hậu"
      - "chưa được giáo dục"
    legal_ref: "Luật XLVPHC Điều 9 khoản 7"
    verified: true

